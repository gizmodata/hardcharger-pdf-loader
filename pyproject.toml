[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hardcharger-pdf-loader"
version = "0.1.0"
description = "Load PDF files (bytes + extracted page text + metadata) into a Hardcharger server over Chargewire / ADBC."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["hardcharger", "pdf", "adbc", "chargewire", "ocr", "full-text-search"]
authors = [{ name = "GizmoData", email = "support@gizmodata.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
]
dependencies = [
    "adbc-driver-hardcharger>=2.0.2",
    "pyarrow>=26.0.0",
    "pymupdf>=1.26.0",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build", "ruff", "twine", "hardcharger==2.0.1"]

[project.scripts]
hardcharger-pdf-loader = "hardcharger_pdf_loader.cli:main"

[project.urls]
Homepage = "https://github.com/gizmodata/hardcharger-pdf-loader"
Repository = "https://github.com/gizmodata/hardcharger-pdf-loader"
Issues = "https://github.com/gizmodata/hardcharger-pdf-loader/issues"
Changelog = "https://github.com/gizmodata/hardcharger-pdf-loader/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/hardcharger_pdf_loader"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "README.md", "CHANGELOG.md", "LICENSE", "docs/", ".github/", "main.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs against a real Hardcharger server"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
