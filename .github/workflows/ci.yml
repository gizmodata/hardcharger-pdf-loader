name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples
      - name: Full suite (OCR, DuckDB and DuckLake on the released Hardcharger server)
        env:
          GH_TOKEN: ${{ github.token }}
        run: pytest -q -ra --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: tests-python-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install twine
          python -m twine check --strict dist/*
      - name: Check installed wheel and entry points
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          hardcharger-pdf-loader --help
          python -m hardcharger_pdf_loader --version
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - name: Check tag matches pyproject version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $PROJECT_VERSION" >&2
            exit 1
          fi
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { printing = 1; next }
            printing && /^## \[/ { exit }
            printing { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG section found for $VERSION" >&2
            exit 1
          fi
          cat release_notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: dist/*

  publish-pypi:
    # Trusted publishing (OIDC): register this repo/workflow as a publisher for the project on
    # pypi.org (Manage -> Publishing -> environment "pypi"); no API token secret is needed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hardcharger-pdf-loader/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
